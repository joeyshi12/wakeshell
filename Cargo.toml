[package]
name = "wakeshell"
version = "0.1.0"
edition = "2024"
description = "Desktop shell for dwl: wallpaper, bar, launcher, notifications, volume popup, power menu, polkit agent and screen-share picker"
license = "MIT"

[dependencies]
async-channel = "=2.5.0"
gio-unix = "=0.22.8"
glib-unix = "=0.22.8"
gtk = { package = "gtk4", version = "=0.11.5", features = ["v4_16"] }
gtk4-layer-shell = "=0.8.1"
libc = "=0.2.191"
resvg = { version = "=0.48.1", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
wayland-client = "=0.31.15"
wayland-scanner = "=0.31.11"
zbus = "=5.19.0"

[profile.release]
lto = "thin"
strip = true
